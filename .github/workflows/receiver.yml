name: Build, validate and release
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Plan release version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version || steps.current.outputs.version }}
    steps:
      - name: Check out source and release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read current package version
        id: current
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js for release tooling
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - name: Install locked release tooling
        run: npm ci --prefix .github/release
      - name: Plan the semantic release version without publishing
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/release/node_modules/.bin/semantic-release --dry-run --extends ./.github/release/plan.config.mjs
  reference:
    name: ${{ matrix.purpose }} / AMD64
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    runs-on: ${{ matrix.platform.runner }}
    container: ubuntu:26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        build: [Release, ASan-UBSan, TSan]
        include:
          - build: Release
            purpose: Verify release package
          - build: ASan-UBSan
            purpose: Check memory safety and undefined behavior
          - build: TSan
            purpose: Check thread safety
        platform:
          - architecture: amd64
            runner: ubuntu-24.04
    env:
      ASDF_DATA_DIR: /opt/asdf
    steps:
      - name: Install C++26 build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git cmake ninja-build gcc-15 g++-15 g++ zstd pkg-config libgtest-dev libpopt-dev libconfig-dev libpulse-dev libavahi-client-dev libssl-dev libplist-dev libplist-utils libsodium-dev libgcrypt20-dev uuid-dev libavutil-dev libavcodec-dev libavformat-dev libswresample-dev xxd dpkg-dev file systemd
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use the planned package version
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            printf '%s\n' "$RELEASE_VERSION" > VERSION
          fi
      - name: Set up pinned C++26 compiler
        uses: ./.github/actions/setup-toolchain
      - name: Configure
        env:
          BUILD: ${{ matrix.build }}
        run: |
          build_type="$BUILD"
          sanitizer_flags=
          case "$BUILD" in
            ASan-UBSan) build_type=Debug; sanitizer_flags='-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' ;;
            TSan) build_type=Debug; sanitizer_flags='-fsanitize=thread -fno-omit-frame-pointer' ;;
          esac
          cmake -S . -B build/cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake -DCMAKE_BUILD_TYPE="$build_type" -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_SYSCONFDIR=/etc -DUSE_GIT_VERSION=OFF -DCMAKE_C_FLAGS="$sanitizer_flags" -DCMAKE_CXX_FLAGS="$sanitizer_flags"
      - name: Build
        run: cmake --build build/cmake --parallel 2
      - name: Verify sanitizer instrumentation
        if: matrix.build != 'Release'
        env:
          BUILD: ${{ matrix.build }}
        run: |
          case "$BUILD" in
            ASan-UBSan)
              nm -u build/cmake/CMakeFiles/receiver.dir/src/platform/utilities/structured_buffer.cpp.o | grep __asan_init
              nm -u build/cmake/CMakeFiles/receiver.dir/src/protocol/rtsp/rtsp.cpp.o | grep __ubsan_handle
              nm -u build/cmake/companion/nqptp/CMakeFiles/nqptp-core.dir/runtime.cpp.o | grep __asan_init
              nm -u build/cmake/companion/nqptp/CMakeFiles/nqptp-core.dir/nqptp-message-handlers.cpp.o | grep __ubsan_handle
              ;;
            TSan)
              nm -u build/cmake/CMakeFiles/receiver.dir/src/platform/utilities/structured_buffer.cpp.o | grep __tsan_init
              nm -u build/cmake/CMakeFiles/receiver.dir/src/protocol/rtsp/rtsp.cpp.o | grep __tsan_init
              nm -u build/cmake/companion/nqptp/CMakeFiles/nqptp-core.dir/runtime.cpp.o | grep __tsan_init
              nm -u build/cmake/companion/nqptp/CMakeFiles/nqptp-core.dir/nqptp-message-handlers.cpp.o | grep __tsan_init
              ;;
          esac
      - name: Test
        run: ctest --test-dir build/cmake --no-tests=error --output-on-failure
      - name: Verify staged install
        if: matrix.build == 'Release'
        run: |
          DESTDIR="$PWD/build/cmake/stage" cmake --install build/cmake
          test -f build/cmake/stage/usr/bin/shairport-2
          cmp man/shairport-2.1 build/cmake/stage/usr/share/man/man1/shairport-2.1
          cmp scripts/shairport-2.conf build/cmake/stage/etc/shairport-2.conf.sample
          test -f build/cmake/stage/usr/lib/systemd/user/shairport-2.service
          cmake -DROOT="$PWD/build/cmake/stage" -DPREFIX=/usr -P tests/program_identity_test.cmake
          cmake -DROOT="$PWD/build/cmake/stage" -DPREFIX=/usr -DVERSION="$(cat VERSION)" -P tests/nqptp_package_test.cmake
          cmake -DROOT="$PWD/build/cmake/stage" -DPREFIX=/usr -P tests/nqptp_unit_test.cmake
      - name: Build Debian package
        if: matrix.build == 'Release'
        run: |
          cpack --config build/cmake/CPackConfig.cmake -B build/cmake/packages
          dpkg-deb --info build/cmake/packages/*.deb
          dpkg-deb --contents build/cmake/packages/*.deb
          dpkg-deb -x build/cmake/packages/*.deb build/cmake/package-check
          version=$(cat VERSION)
          test "$(dpkg-deb -f build/cmake/packages/*.deb Version)" = "$version"
          test "$(dpkg-deb -f build/cmake/packages/*.deb Architecture)" = '${{ matrix.platform.architecture }}'
          build/cmake/package-check/usr/bin/shairport-2 --version | grep -F "$version-AirPlay2-"
          build/cmake/package-check/usr/bin/shairport-2 --check-config --config build/cmake/package-check/etc/shairport-2.conf.sample
          cmake -DROOT="$PWD/build/cmake/package-check" -DPREFIX=/usr -DVERSION="$version" -DPACKAGE="$PWD/build/cmake/packages/shairport-2_${version}_${{ matrix.platform.architecture }}.deb" -P tests/nqptp_package_test.cmake
          cmake -DROOT="$PWD/build/cmake/package-check" -DPREFIX=/usr -DPACKAGE="$PWD/build/cmake/packages/shairport-2_${version}_${{ matrix.platform.architecture }}.deb" -P tests/program_identity_test.cmake
      - name: Upload Debian package
        if: matrix.build == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: deb-ubuntu-26.04-${{ matrix.platform.architecture }}-${{ github.sha }}
          path: build/cmake/packages/*
          if-no-files-found: error
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-${{ matrix.platform.architecture }}-${{ matrix.build }}-${{ github.sha }}
          path: build/cmake/Testing/Temporary/
          if-no-files-found: ignore
  release-policy:
    name: Validate release automation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js for release tooling
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - name: Install locked release tooling
        run: npm ci --prefix .github/release
      - name: Test release automation
        run: npm test --prefix .github/release
  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [plan, reference, release-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: shairport-2-release
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out source and release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check release freshness
        id: freshness
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            git checkout -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A later push superseded this release; its validation will cover the commit range.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download tested amd64 package
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v7
        with:
          name: deb-ubuntu-26.04-amd64-${{ github.sha }}
          path: build/release/packages
      - name: Set up Node.js for release tooling
        uses: actions/setup-node@v6
        if: steps.freshness.outputs.current == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - name: Install locked release tooling
        if: steps.freshness.outputs.current == 'true'
        run: npm ci --prefix .github/release
      - name: Release version, changelog and Debian package
        if: steps.freshness.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/release/node_modules/.bin/semantic-release --extends ./.github/release/release.config.mjs
      - name: Upload prepared release packages after failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-packages-${{ github.sha }}
          path: build/release/packages/*
          if-no-files-found: ignore
