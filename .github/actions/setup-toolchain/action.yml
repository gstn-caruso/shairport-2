name: Set up pinned C++26 toolchain
description: Install and register the verified LLVM archive with asdf
runs:
  using: composite
  steps:
    - name: Select native toolchain archives
      id: architecture
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64)
            echo 'asdf_arch=amd64' >> "$GITHUB_OUTPUT"
            echo 'llvm_arch=X64' >> "$GITHUB_OUTPUT"
            echo 'llvm_sha256=14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba' >> "$GITHUB_OUTPUT"
            ;;
          aarch64)
            echo 'asdf_arch=arm64' >> "$GITHUB_OUTPUT"
            echo 'llvm_arch=ARM64' >> "$GITHUB_OUTPUT"
            echo 'llvm_sha256=1154f37ec15b5654fcb8cc3a8a2352a4cc4eef44bdff7ddd47fb10ea85c82f01' >> "$GITHUB_OUTPUT"
            ;;
          *) echo 'Unsupported native toolchain architecture' >&2; exit 1 ;;
        esac
    - name: Install asdf
      shell: bash
      env:
        ASDF_ARCH: ${{ steps.architecture.outputs.asdf_arch }}
      run: |
        curl -fsSL "https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-linux-$ASDF_ARCH.tar.gz" -o /tmp/asdf.tar.gz
        tar -xzf /tmp/asdf.tar.gz -C /usr/local/bin asdf
    - name: Restore pinned compiler cache
      uses: actions/cache@v4
      id: llvm-cache
      with:
        path: /opt/asdf/installs/clang/23.1.3
        key: llvm-23.1.3-linux-${{ steps.architecture.outputs.llvm_arch }}-${{ steps.architecture.outputs.llvm_sha256 }}-v2
    - name: Install official LLVM binaries
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        LLVM_ARCH: ${{ steps.architecture.outputs.llvm_arch }}
        LLVM_SHA256: ${{ steps.architecture.outputs.llvm_sha256 }}
      run: |
        curl --fail --silent --show-error --location --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-$LLVM_ARCH.tar.zst" -o /tmp/llvm.tar.zst
        printf '%s  %s\n' "$LLVM_SHA256" /tmp/llvm.tar.zst | sha256sum --check
        mkdir -p /opt/asdf/installs/clang/23.1.3
        archive_root="LLVM-23.1.3-Linux-$LLVM_ARCH"
        tar --use-compress-program='zstd --decompress --long=30' --extract --file /tmp/llvm.tar.zst --directory /opt/asdf/installs/clang/23.1.3 --strip-components=1 "$archive_root/bin/clang" "$archive_root/bin/clang++" "$archive_root/bin/clang-23" "$archive_root/bin/clang-scan-deps" "$archive_root/lib/clang" "$archive_root/include/llvm/Support/LICENSE.TXT"
    - name: Register pinned Clang with asdf
      shell: bash
      run: |
        if ! asdf plugin list | grep -qx clang; then
        asdf plugin add clang https://github.com/higebu/asdf-llvm.git
        fi
        git -C /opt/asdf/plugins/clang checkout b7b8dd389c790237145e7436f1cd85b49611e37e
        asdf reshim clang
        asdf which clang++
        asdf exec clang++ --version
        echo /opt/asdf/shims >> "$GITHUB_PATH"
