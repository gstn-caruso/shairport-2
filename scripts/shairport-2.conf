// AirPlay 2 receiver for Linux. PulseAudio, Avahi and NQPTP are required.
// PipeWire works through its PulseAudio-compatible server (pipewire-pulse).
// Validate with shairport-2 --check-config --config /etc/shairport-2.conf.
// Restart the systemd user service after changing settings.
general = {
  name = "%H";
  // interface = "eth0";
  // port = 7000;
  // udp_port_base = 6001;
  // udp_port_range = 10;
  interpolation = "vernier"; // auto, basic or vernier
  // default_airplay_volume = -24.0;
  // ignore_volume_control = "no";
  // volume_range_db = 60;
  // volume_max_db = 0.0;
  // volume_control_profile = "standard";
  // output_channel_mapping = ("FL", "FR");
  // drift_tolerance_in_seconds = 0.002;
  // resync_threshold_in_seconds = 0.050;
};
pulseaudio = {
  // server = "unix:/run/user/1000/pulse/native";
  // sink = "your_pulseaudio_sink_name";
  application_name = "shairport-2";
  // default_channel_layouts = "pulseaudio";
};
sessioncontrol = {
  session_timeout = 60;
  // active_state_timeout = 10.0;
};
diagnostics = {
  log_verbosity = 0;
  statistics = "no";
  // log_output_level = "no";
};
